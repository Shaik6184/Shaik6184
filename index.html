  <style>
    :root {
      --bg: #0A101F;
      --panel: #0C1426;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #22D3EE;
      --violet: #A78BFA;
      --emerald: #10B981;
      --border: rgba(34, 211, 238, 0.25);
    }
    body.light-theme {
      --bg: #F8FAFC;
      --panel: #FFFFFF;
      --text: #0F172A;
      --muted: #475569;
      --accent: #0891B2;
      --violet: #7C3AED;
      --emerald: #059669;
      --border: rgba(8, 145, 178, 0.25);
    }
    body {
      margin: 0;
      padding: 24px;
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
    }
    .preview-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .preview-title {
      align-self: flex-start;
      font-size: 0.9rem;
      color: var(--violet);
      letter-spacing: 1px;
    }
    img.showcase-svg {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .stats-row {
      display: flex;
      width: 100%;
      gap: 16px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .stats-row img {
      flex: 1;
      min-width: 320px;
      max-width: 100%;
      border-radius: 8px;
    }
    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .social-links a {
      text-decoration: none;
    }
  </style>
</head>
